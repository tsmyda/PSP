[project]
name = "psp"
version = "0.1.0"
description = "Protein structure prediction: dataset preparation from PDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gemmi>=0.7.5",
    "matplotlib>=3.9",
    "scikit-bio>=0.6",
]

# Choose the torch build: `uv sync --extra cpu` or `uv sync --extra cu128`.
# On macOS both resolve to the PyPI wheel (CPU + MPS).
[project.optional-dependencies]
cpu = ["torch>=2.7"]
cu128 = ["torch>=2.7"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
